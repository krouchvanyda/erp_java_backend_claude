# ===========================================================================
# ERP backend — Laravel 8 / PHP 7.4 stack
#   web         nginx reverse proxy (http://localhost:8080)
#   app         php-fpm (runs migrate --seed on boot, then serves)
#   websockets  beyondcode/laravel-websockets (Pusher protocol, port 6001)
#   db          PostgreSQL 16
# ===========================================================================
version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-erp}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PUSHER_HOST: websockets
      PUSHER_PORT: 6001
      BROADCAST_DRIVER: pusher
    entrypoint: ["bash", "/var/www/html/docker/entrypoint.sh"]
    volumes:
      - ./:/var/www/html
      - avatars:/var/www/html/uploads

  web:
    image: nginx:1.25-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - avatars:/var/www/html/uploads
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  websockets:
    build: .
    depends_on:
      - db
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    command: ["php", "artisan", "websockets:serve", "--host=0.0.0.0", "--port=6001"]
    ports:
      - "6001:6001"

volumes:
  pgdata:
  avatars:
