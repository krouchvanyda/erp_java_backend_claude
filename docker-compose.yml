# ===========================================================================
# ERP backend — Laravel 8 / PHP 7.4 stack
#   web    nginx reverse proxy (http://localhost:8080) — routes /ws to stomp,
#          everything else to the php-fpm app. Same origin/port as the REST API,
#          matching the Spring deployment the Flutter app expects.
#   app    php-fpm (runs migrate --seed on boot)
#   stomp  STOMP-over-WebSocket server (erp:stomp-serve) — the Spring SimpleBroker
#          replacement; reached via nginx at /ws and /ws-sockjs
#   redis  shared cache (presence state) + STOMP fan-out pub/sub channel
#   db     PostgreSQL 17
# ===========================================================================
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-erp}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  app:
    build: .
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_CLIENT: predis
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: "null"
    entrypoint: ["bash", "/var/www/html/docker/entrypoint.sh"]
    volumes:
      - ./:/var/www/html
      - avatars:/var/www/html/uploads

  stomp:
    build: .
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_CLIENT: predis
      CACHE_DRIVER: redis
    command: ["php", "artisan", "erp:stomp-serve", "--host=0.0.0.0", "--port=8090"]
    volumes:
      - ./:/var/www/html
      - avatars:/var/www/html/uploads

  web:
    image: nginx:1.25-alpine
    depends_on:
      - app
      - stomp
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - avatars:/var/www/html/uploads
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  avatars:
